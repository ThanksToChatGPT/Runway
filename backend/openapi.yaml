openapi: 3.0.3
info:
  title: Outfit Builder MVP API
  version: 0.1.0
  description: API REST del MVP (Release 1) para Outfit Builder.
servers:
  - url: http://localhost:4000/api
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
            name:
              type: string
            role:
              type: string
    Preferences:
      type: object
      properties:
        min_price_cop:
          type: integer
          minimum: 0
        max_price_cop:
          type: integer
          minimum: 0
        budget_limit_cop:
          type: integer
          minimum: 0
paths:
  /health:
    get:
      summary: Healthcheck del backend
      responses:
        "200":
          description: OK
  /auth/register:
    post:
      summary: Registro local de usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string }
                password: { type: string, minLength: 6 }
                name: { type: string }
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /auth/login:
    post:
      summary: Inicio de sesión local
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /preferences:
    get:
      summary: Obtener preferencias de presupuesto y rango de precio
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Preferencias del usuario
    put:
      summary: Actualizar preferencias de presupuesto y rango de precio
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Preferences"
      responses:
        "200":
          description: Preferencias actualizadas
  /products:
    get:
      summary: Buscar y filtrar productos con paginación y orden por precio
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string, enum: [top, bottom, shoes] }
        - in: query
          name: brand
          schema: { type: string }
        - in: query
          name: color
          schema: { type: string }
        - in: query
          name: size
          schema: { type: string }
        - in: query
          name: storeId
          schema: { type: string, format: uuid }
        - in: query
          name: minPrice
          schema: { type: integer }
        - in: query
          name: maxPrice
          schema: { type: integer }
        - in: query
          name: sort
          schema: { type: string, enum: [price_asc, price_desc, newest] }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 12 }
      responses:
        "200":
          description: Lista paginada de productos
  /products/compare:
    get:
      summary: Comparar productos lado a lado
      parameters:
        - in: query
          name: ids
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Detalle de productos seleccionados
  /products/{id}:
    get:
      summary: Detalle de producto con fotos, tallas y enlace externo
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Detalle del producto
  /outfits:
    get:
      summary: Listar outfits guardados del usuario
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Outfits del usuario
    post:
      summary: Guardar un outfit (top, bottom, shoes) con cálculo total en COP
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Outfit guardado
  /admin/stores:
    get:
      summary: Listar tiendas registradas
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Lista de tiendas
    post:
      summary: Crear tienda (Admin)
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Tienda creada
  /admin/stores/{id}:
    put:
      summary: Actualizar tienda (Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Tienda actualizada
    delete:
      summary: Eliminar tienda (Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Tienda eliminada
  /admin/stores/{id}/scrape:
    post:
      summary: Ejecutar scraping y estandarización de productos para una tienda (Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Resumen de productos importados
