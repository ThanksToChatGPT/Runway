services:
  scraper:
    build:
      context: ./scraper
    container_name: outfit_builder_scraper
    restart: unless-stopped
    environment:
      PORT: 8000
      SCRAPER_TIMEOUT_MS: ${SCRAPER_TIMEOUT_MS:-15000}
      SCRAPER_MAX_PRODUCTS: ${SCRAPER_MAX_PRODUCTS:-150}
      SCRAPER_IMAGE_ANALYSIS: ${SCRAPER_IMAGE_ANALYSIS:-false}
    ports:
      - "8000:8000"

  backend:
    build:
      context: ./backend
    container_name: outfit_builder_backend
    restart: unless-stopped
    depends_on:
      scraper:
        condition: service_started
    environment:
      PORT: ${PORT:-4000}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL requerida}
      DB_SSL: ${DB_SSL:-true}
      DB_POOL_MAX: ${DB_POOL_MAX:-5}
      NODE_EXTRA_CA_CERTS: /certs/supabase-ca.crt
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requerido}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      SCRAPER_URL: ${SCRAPER_URL:-http://scraper:8000}
      SCRAPER_TIMEOUT_MS: ${SCRAPER_TIMEOUT_MS:-15000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    volumes:
      - ./backend/certs/supabase-ca.crt:/certs/supabase-ca.crt:ro
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    container_name: outfit_builder_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    ports:
      - "3000:3000"
