<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outfit scraper viewer</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#6a7385; --line:#dfe3ea; --accent:#2f6fed;
          --ok:#1a8f4d; --warn:#c77a00; --bad:#c62f2f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171d; --card:#1d222b; --text:#e8ebf1; --muted:#98a1b3; --line:#2c3340; --accent:#6c9bff;
            --ok:#4cc27f; --warn:#e6a23c; --bad:#ef6a6a; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;
           padding:14px 20px; border-bottom:1px solid var(--line); background:var(--card); }
  h1 { font-size:18px; margin:0; } h2 { font-size:15px; margin:0 0 10px; }
  main { padding:20px; display:grid; gap:20px; max-width:1300px; margin:0 auto; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  button { font:inherit; padding:6px 12px; border-radius:7px; border:1px solid var(--line);
           background:var(--card); color:var(--text); cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  .stats { display:flex; flex-wrap:wrap; gap:12px; }
  .stat { flex:1 1 140px; border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .stat b { display:block; font-size:22px; } .stat span { color:var(--muted); font-size:12px; }
  table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  .wrap { overflow-x:auto; }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; border:1px solid currentColor; }
  .success { color:var(--ok); } .partial { color:var(--warn); } .failed { color:var(--bad); } .running, .none { color:var(--muted); }
  .filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .filters input, .filters select { font:inherit; padding:6px 8px; border-radius:7px; border:1px solid var(--line);
                                    background:var(--card); color:var(--text); }
  .filters .check { display:flex; align-items:center; gap:5px; font-size:12px; color:var(--muted); }
  .filters .check input { accent-color:var(--accent); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:14px; }
  .item { border:1px solid var(--line); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; }
  .item img { width:100%; aspect-ratio:1/1; object-fit:cover; background:var(--line); }
  .item .body { padding:10px; display:flex; flex-direction:column; gap:4px; flex:1; }
  .price { font-weight:700; font-size:16px; } .muted { color:var(--muted); font-size:12px; }
  .chips span { display:inline-block; margin:0 4px 4px 0; padding:1px 7px; border-radius:6px; background:var(--bg); font-size:12px; border:1px solid var(--line); }
  .chips span.no { text-decoration:line-through; color:var(--muted); }
  .item a { color:var(--accent); text-decoration:none; margin-top:auto; }
  pre.err { margin:4px 0 0; white-space:pre-wrap; color:var(--muted); font-size:12px; max-height:90px; overflow:auto; }
  #status { color:var(--muted); }
  .slider { position:relative; background:#fff; }
  .track { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; scroll-behavior:smooth; outline:none; }
  .track::-webkit-scrollbar { display:none; }
  .track img { flex:0 0 100%; scroll-snap-align:center; aspect-ratio:1/1; object-fit:contain; background:#fff; cursor:zoom-in; }
  .arrow { position:absolute; top:50%; transform:translateY(-50%); width:30px; height:30px; padding:0; border-radius:50%;
           background:rgba(0,0,0,.45); color:#fff; border:0; font-size:18px; line-height:30px; text-align:center; opacity:0; transition:opacity .15s; }
  .slider:hover .arrow, .slider:focus-within .arrow { opacity:1; }
  .arrow.prev { left:6px; } .arrow.next { right:6px; }
  .dots { position:absolute; bottom:6px; left:0; right:0; display:flex; justify-content:center; gap:5px; pointer-events:none; }
  .dots i { width:7px; height:7px; border-radius:50%; background:rgba(0,0,0,.25); }
  .dots i.on { background:var(--accent); }
  .kind { position:absolute; top:8px; left:8px; padding:1px 8px; border-radius:99px; font-size:11px; background:rgba(255,255,255,.9); color:#222; border:1px solid #ccc; }
  .kind.pack { left:auto; right:8px; background:var(--accent); color:#fff; border-color:var(--accent); }
  #lightbox { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; z-index:10; }
  #lightbox.open { display:flex; }
  #lightbox .slider { width:min(92vw, 80vh); } #lightbox .track img { cursor:default; }
  #lightbox .arrow { opacity:1; width:38px; height:38px; font-size:22px; line-height:38px; }
  #close { position:fixed; top:14px; right:18px; font-size:26px; color:#fff; background:none; border:0; cursor:pointer; }

</style>
</head>
<body>
<header>
  <h1>Outfit scraper viewer</h1>
  <div><span id="status"></span> <button class="primary" id="runAll">Run all active stores</button> <button id="refresh">Refresh</button></div>
</header>
<main>
  <section><h2>Summary</h2><div class="stats" id="stats"></div></section>
  <section><h2>Stores</h2><div class="wrap"><table id="stores"></table></div></section>
  <section>
    <h2>Products</h2>
    <div class="filters">
      <input id="q" placeholder="Search name or brand">
      <select id="store"><option value="">All stores</option></select>
      <select id="category"><option value="">All categories</option><option>top</option><option>bottom</option><option>footwear</option><option>accessory</option><option>other</option></select>
      <input id="color" placeholder="Color (e.g. black)" size="12">
      <input id="size" placeholder="Size (e.g. M)" size="8">
      <input id="max_price" type="number" placeholder="Max price COP" min="0">
      <select id="sort"><option value="updated">Newest</option><option value="price_asc">Price: low to high</option><option value="price_desc">Price: high to low</option><option value="name">Name</option></select>
      <label class="check"><input type="checkbox" id="single_garment" checked> single garment (no packs)</label>
    </div>
    <div id="count" class="muted"></div>
    <div class="grid" id="products"></div>
  </section>
  <section><h2>Latest scraping logs</h2><div class="wrap"><table id="logs"></table></div></section>
</main>
<div id="lightbox"><button id="close" aria-label="Close">×</button></div>
<script>
const $ = id => document.getElementById(id);
const money = new Intl.NumberFormat('es-CO', {style:'currency', currency:'COP', maximumFractionDigits:0});
// Scraped data is untrusted: always build the page with textContent, never with innerHTML.
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) { if (k === 'class') e.className = v; else e[k] = v; }
  for (const kid of kids) e.append(kid);
  return e;
}
const pill = status => el('span', {class: 'pill ' + (status || 'none'), textContent: status || 'never run'});
const get = async url => (await fetch(url)).json();

async function loadStats() {
  const s = await get('/api/stats');
  $('stats').replaceChildren(...[['Products', s.products], ['Single garments', s.products - (s.packs || 0)],
    ['Packs/kits', s.packs || 0],
    ['Stores', `${s.active_stores} active / ${s.stores}`], ['Last run', s.last_run || '—'],
    ...Object.entries(s.categories).map(([c, n]) => ['Category: ' + c, n])]
    .map(([label, value]) => el('div', {class: 'stat'}, el('b', {textContent: String(value)}), el('span', {textContent: label}))));
}
async function loadStores() {
  const stores = await get('/api/stores');
  const head = el('tr', {}, ...['Store', 'Platform', 'Active', 'Products', 'Last scraped', 'Last status', ''].map(t => el('th', {textContent: t})));
  const rows = stores.map(s => {
    const btn = el('button', {textContent: 'Run now'}); btn.onclick = () => run(s.id);
    const status = el('td', {}, pill(s.last_status));
    if (s.last_errors) status.append(el('pre', {class: 'err', textContent: s.last_errors}));
    return el('tr', {}, el('td', {textContent: s.name}), el('td', {textContent: s.platform}),
      el('td', {textContent: s.is_active ? 'yes' : 'no'}), el('td', {textContent: String(s.products)}),
      el('td', {textContent: s.last_scraped_at || '—'}), status, el('td', {}, btn));
  });
  $('stores').replaceChildren(head, ...rows);
  const sel = $('store'), current = sel.value;
  sel.replaceChildren(el('option', {value: '', textContent: 'All stores'}), ...stores.map(s => el('option', {value: s.id, textContent: s.name})));
  sel.value = current;
}
async function loadLogs() {
  const logs = await get('/api/logs?limit=20');
  const head = el('tr', {}, ...['Date', 'Store', 'Status', 'Found', 'Saved', 'Errors'].map(t => el('th', {textContent: t})));
  const rows = logs.map(l => el('tr', {}, el('td', {textContent: l.execution_date}), el('td', {textContent: l.store_name}),
    el('td', {}, pill(l.status)), el('td', {textContent: String(l.products_found)}), el('td', {textContent: String(l.products_saved)}),
    el('td', {}, el('pre', {class: 'err', textContent: l.errors || ''}))));
  $('logs').replaceChildren(head, ...rows);
}
const KIND_LABEL = {'product-only': 'garment alone', 'model': 'on a model', 'other': 'detail / other'};
// A swipeable image slider. Only image URLs are used: nothing is stored or copied.
function slider(images, name, onOpen) {
  const wrap = el('div', {class: 'slider'});
  const track = el('div', {class: 'track', tabIndex: 0});
  const dots = el('div', {class: 'dots'});
  const badge = el('span', {class: 'kind'});
  images.forEach((im, i) => {
    const img = el('img', {loading: 'lazy', alt: `${name} (${i + 1}/${images.length})`, src: im.url});
    img.referrerPolicy = 'no-referrer';
    img.onerror = () => { img.style.visibility = 'hidden'; };
    if (onOpen) img.onclick = () => onOpen(i);
    track.append(img); dots.append(el('i'));
  });
  const show = i => {
    [...dots.children].forEach((d, k) => d.classList.toggle('on', k === i));
    const kind = images[i] && images[i].kind;
    badge.textContent = KIND_LABEL[kind] || ''; badge.style.display = KIND_LABEL[kind] ? '' : 'none';
  };
  const index = () => Math.round(track.scrollLeft / Math.max(track.clientWidth, 1));
  const go = d => { track.scrollLeft += d * track.clientWidth; };
  track.addEventListener('scroll', () => show(index()));
  track.addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(1); if (e.key === 'ArrowLeft') go(-1); });
  wrap.append(track, badge);
  if (images.length > 1) {
    const prev = el('button', {class: 'arrow prev', textContent: '‹', title: 'Previous'}); prev.onclick = () => go(-1);
    const next = el('button', {class: 'arrow next', textContent: '›', title: 'Next'}); next.onclick = () => go(1);
    wrap.append(prev, next, dots);
  }
  wrap.start = i => { track.style.scrollBehavior = 'auto'; track.scrollLeft = i * track.clientWidth; track.style.scrollBehavior = ''; track.focus(); };
  show(0);
  return wrap;
}
function openLightbox(images, name, start) {
  const box = $('lightbox');
  box.querySelectorAll('.slider').forEach(s => s.remove());
  const s = slider(images, name); box.append(s); box.classList.add('open'); s.start(start);
}
$('close').onclick = () => $('lightbox').classList.remove('open');
$('lightbox').onclick = e => { if (e.target === $('lightbox')) $('lightbox').classList.remove('open'); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('lightbox').classList.remove('open'); });

async function loadProducts() {
  const p = new URLSearchParams();
  for (const id of ['q', 'store', 'category', 'color', 'size', 'max_price', 'sort']) if ($(id).value) p.set(id, $(id).value.trim());
  if ($('single_garment').checked) p.set('single_garment', '1');
  const data = await get('/api/products?' + p);
  $('count').textContent = `${data.total} products` + (data.total > data.items.length ? ` (showing ${data.items.length})` : '');
  $('products').replaceChildren(...data.items.map(it => {
    const media = it.images.length ? slider(it.images, it.name, i => openLightbox(it.images, it.name, i))
                                   : el('div', {class: 'slider'}, el('div', {class: 'muted', textContent: 'No image'}));
    if ((it.pack_size || 1) > 1) media.append(el('span', {class: 'kind pack', textContent: `pack of ${it.pack_size}`}));
    const chips = el('div', {class: 'chips'}, ...it.sizes.map(s => el('span', {class: s.available ? '' : 'no',
      textContent: s.size + (s.units != null ? ` · ${s.units}` : '')})));
    const link = el('a', {href: it.external_url, target: '_blank', rel: 'noopener noreferrer', textContent: 'Open in store ↗'});
    const pieces = (it.pack_size || 1) > 1 ? ` · ${it.pack_evidence ? `pack (${it.pack_evidence})` : 'pack'}` : ' · single garment';
    return el('div', {class: 'item'}, media, el('div', {class: 'body'},
      el('div', {textContent: it.name}), el('div', {class: 'price', textContent: money.format(it.price_cop)}),
      el('div', {class: 'muted', textContent: `${it.brand} · ${it.store_name}`}),
      el('div', {class: 'muted', textContent: [it.category, it.subcategory, it.color, it.material].filter(Boolean).join(' · ')}),
      el('div', {class: 'muted', textContent: ((it.pack_size || 1) > 1 ? `Sold as: pack of ${it.pack_size}` : 'Sold as: single garment') + pieces}),
      chips, link));
  }));
}
async function refreshAll() { await Promise.all([loadStats(), loadStores(), loadLogs(), loadProducts()]); }
async function run(store) {
  const r = await fetch('/api/run', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({store})});
  if (r.status === 409) alert('A run is already in progress.');
  poll();
}
let timer;
async function poll() {
  clearInterval(timer);
  const tick = async () => {
    const s = await get('/api/run-status');
    $('status').textContent = s.running ? 'Running: ' + s.current + '…' : '';
    $('runAll').disabled = s.running;
    if (!s.running) { clearInterval(timer); refreshAll(); }
  };
  await tick(); timer = setInterval(tick, 1500);
}
$('runAll').onclick = () => run(null);
$('refresh').onclick = refreshAll;
for (const id of ['q', 'store', 'category', 'color', 'size', 'max_price', 'sort']) $(id).addEventListener('input', () => { clearTimeout(window.t); window.t = setTimeout(loadProducts, 250); });
$('single_garment').addEventListener('change', () => { clearTimeout(window.t); window.t = setTimeout(loadProducts, 100); });
refreshAll(); poll();
</script>
</body>
</html>
